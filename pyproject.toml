[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scope-review"
version = "0.1.0"
description = "Review agent tool permission changes before rollout"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
dependencies = []

[project.scripts]
scope-review = "scope_review.cli:main"

[tool.setuptools.packages.find]
include = ["scope_review*"]
